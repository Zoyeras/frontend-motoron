name: Frontend CI/CD

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'frontend-motoron/**'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'frontend-motoron/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend-motoron/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./frontend-motoron
      run: npm ci
    
    - name: Build
      working-directory: ./frontend-motoron
      run: npm run build
    
    - name: Verify build output
      working-directory: ./frontend-motoron
      run: |
        if [ -d "dist" ]; then
          echo "✓ Build successful"
        else
          echo "✗ Build failed"
          exit 1
        fi
